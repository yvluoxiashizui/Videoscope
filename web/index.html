<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videoscope</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 80px;
    background: var(--bg); color: var(--text);
    font: 15px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  h2 { font-size: 15px; margin: 0 0 14px; color: var(--muted); font-weight: 500; }
  input[type=text], input[type=password], input[type=file] {
    width: 100%; padding: 9px 11px; margin-bottom: 10px;
    background: #0c0e12; border: 1px solid var(--line);
    border-radius: 7px; color: var(--text); font-size: 14px;
  }
  input[type=file] { padding: 7px; }
  button {
    padding: 9px 18px; border: 0; border-radius: 7px;
    background: var(--accent); color: #fff; font-size: 14px;
    cursor: pointer; transition: opacity .15s;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: #232833; color: var(--text); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  progress {
    width: 100%; height: 8px; margin: 12px 0 6px;
    appearance: none; border-radius: 4px; overflow: hidden;
  }
  progress::-webkit-progress-bar { background: #232833; }
  progress::-webkit-progress-value { background: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; }
  .status { font-size: 14px; margin-top: 8px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.run { color: var(--warn); }
  ul { margin: 0; padding-left: 20px; }
  li { margin-bottom: 6px; }
  .chapter {
    border-left: 2px solid var(--line); padding: 2px 0 2px 14px;
    margin-bottom: 14px;
  }
  .chapter b { color: var(--accent); font-weight: 500; }
  .chapter span { color: var(--muted); font-size: 13px; margin-left: 8px; }
  .answer {
    background: #0c0e12; border: 1px solid var(--line);
    border-radius: 7px; padding: 14px; margin-top: 12px;
    white-space: pre-wrap;
  }
  .src { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Videoscope</h1>
  <div class="sub">长视频内容理解 · 上传后自动转写、识别画面、生成结构化总结，并支持追问</div>

  <section id="auth">
    <h2>登录</h2>
    <input type="text" id="username" placeholder="用户名（仅字母数字）" autocomplete="username">
    <input type="password" id="password" placeholder="密码（至少 8 位）" autocomplete="current-password">
    <button onclick="doLogin()">登录 / 注册</button>
    <div class="status" id="authStatus"></div>
  </section>

  <section id="panel" class="hidden">
    <h2>上传视频</h2>
    <input type="file" id="file" accept="video/*">
    <button onclick="startWorkflow()">上传并分析</button>
    <progress id="bar" value="0" max="100" class="hidden"></progress>
    <div class="status" id="status"></div>
  </section>

  <section id="resultBox" class="hidden">
    <h2>总结</h2>
    <div id="summary"></div>
    <h2 style="margin-top:22px">要点</h2>
    <ul id="points"></ul>
    <h2 style="margin-top:22px">章节</h2>
    <div id="chapters"></div>
  </section>

  <section id="askBox" class="hidden">
    <h2>追问</h2>
    <div class="row">
      <input type="text" id="question" placeholder="就视频内容提问，例如：这个视频讲了什么">
      <button onclick="doAsk()" style="flex:0 0 auto">提问</button>
    </div>
    <div id="answers"></div>
  </section>
</div>

<script>
// ---------- 状态 ----------
const S = { token: '', userId: 0, taskId: 0, busy: false };

const CHUNK = 5 * 1024 * 1024; // 与后端一致：5MB
const el = id => document.getElementById(id);

// ---------- 工具 ----------
function setStatus(text, kind = '') {
  const node = el('status');
  node.textContent = text;
  node.className = 'status ' + kind;
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + S.token,
  }, opts.headers || {});
  const resp = await fetch(path, opts);
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.message || ('请求失败 ' + resp.status));
  return body.data;
}

// ---------- 登录 ----------
async function doLogin() {
  const username = el('username').value.trim();
  const password = el('password').value;
  const status = el('authStatus');

  if (!/^[A-Za-z0-9]+$/.test(username)) {
    status.textContent = '用户名只能包含字母和数字';
    status.className = 'status err';
    return;
  }

  status.textContent = '处理中…';
  status.className = 'status';

  // 先尝试注册，已存在会返回错误，忽略即可。
  await fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  }).catch(() => {});

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const body = await resp.json();
    if (!resp.ok) throw new Error(body.message || '登录失败');

    S.token = body.data.token;
    S.userId = body.data.user_id;

    status.textContent = '已登录：' + username;
    status.className = 'status ok';
    el('panel').classList.remove('hidden');
    el('auth').classList.add('hidden');
  } catch (e) {
    status.textContent = e.message;
    status.className = 'status err';
  }
}

// ---------- 主流程 ----------
async function startWorkflow() {
  if (S.busy) return;
  const file = el('file').files[0];
  if (!file) return setStatus('请先选择一个视频文件', 'err');

  S.busy = true;
  el('bar').classList.remove('hidden');
  el('bar').value = 0;

  try {
    const md5 = await md5OfFile(file, p => {
      el('bar').value = p * 0.3; // 计算摘要占前三成进度
      setStatus('计算文件摘要 ' + Math.round(p) + '%', 'run');
    });

    const total = Math.ceil(file.size / CHUNK);
    for (let i = 0; i < total; i++) {
      const blob = file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size));
      const form = new FormData();
      form.append('md5', md5);
      form.append('index', i);
      form.append('total', total);
      form.append('file', blob, 'chunk');

      const resp = await fetch('/api/upload/chunk', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + S.token },
        body: form,
      });
      if (!resp.ok) {
        const b = await resp.json().catch(() => ({}));
        throw new Error(b.message || '分片上传失败');
      }
      el('bar').value = 30 + ((i + 1) / total) * 40;
      setStatus(`上传分片 ${i + 1}/${total}`, 'run');
    }

    const merged = await api('/api/upload/merge', {
      method: 'POST',
      body: JSON.stringify({ md5, total, ext: 'mp4', filename: file.name }),
    });
    S.taskId = merged.task_id;
    el('bar').value = 75;
    setStatus('合并完成，提交分析…', 'run');

    await api('/api/analyze', {
      method: 'POST',
      body: JSON.stringify({ md5 }),
    });

    setStatus('已提交，等待处理…', 'run');
    await watchProgress(S.taskId);

    setStatus('处理完成，加载结果…', 'ok');
    el('bar').value = 100;
    await loadResult(S.taskId);

    el('askBox').classList.remove('hidden');
  } catch (e) {
    setStatus(e.message, 'err');
  } finally {
    S.busy = false;
  }
}

// ---------- SSE：用 fetch 流式读，不用 EventSource ----------
// EventSource 不支持自定义请求头，token 只能塞进 URL，
// 而 token 出现在地址栏和访问日志里是不必要的暴露。
async function watchProgress(taskId) {
  const resp = await fetch(`/api/task/${taskId}/events`, {
    headers: { 'Authorization': 'Bearer ' + S.token },
  });
  if (!resp.ok) throw new Error('订阅进度失败');

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });

    // SSE 以空行分隔事件，逐块解析出完整事件再处理。
    let idx;
    while ((idx = buffer.indexOf('\n\n')) >= 0) {
      const raw = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);

      const dataLine = raw.split('\n').find(l => l.startsWith('data: '));
      if (!dataLine) continue;

      let event;
      try { event = JSON.parse(dataLine.slice(6)); } catch { continue; }

      setStatus(event.text + (event.err_msg ? '：' + event.err_msg : ''), 'run');
      el('bar').value = Math.max(el('bar').value, 80);

      if (event.status === 3) return;
      if (event.status === 4) throw new Error(event.err_msg || '处理失败');
    }
  }
}

// ---------- 结果 ----------
async function loadResult(taskId) {
  // 目前没有单独的查询接口，直接复用追问接口拿不到总结，
  // 所以这里从后端固定路径读取——由服务端渲染在页面上更简单，
  // 但没有对应接口时用一次空查询探测状态并提示即可。
  // 为保持后端接口不变，结果通过一个只读端点获取。
  const data = await api(`/api/task/${taskId}/summary`);
  if (!data) throw new Error('没有拿到分析结果');

  el('summary').textContent = data.summary || '（无）';

  const points = el('points');
  points.innerHTML = '';
  (data.key_points || []).forEach(p => {
    const li = document.createElement('li');
    li.textContent = p;
    points.appendChild(li);
  });

  const box = el('chapters');
  box.innerHTML = '';
  (data.chapters || []).forEach(c => {
    const div = document.createElement('div');
    div.className = 'chapter';
    const b = document.createElement('b');
    b.textContent = c.title;
    const span = document.createElement('span');
    span.textContent = formatTime(c.start);
    div.appendChild(b);
    div.appendChild(span);
    const p = document.createElement('div');
    p.textContent = c.summary;
    div.appendChild(p);
    box.appendChild(div);
  });

  el('resultBox').classList.remove('hidden');
}

function formatTime(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

// ---------- 追问 ----------
async function doAsk() {
  const q = el('question').value.trim();
  if (!q) return;

  const box = el('answers');
  const item = document.createElement('div');
  item.className = 'answer';
  item.textContent = '思考中…';
  box.prepend(item);

  try {
    const data = await api(`/api/task/${S.taskId}/ask`, {
      method: 'POST',
      body: JSON.stringify({ question: q }),
    });

    item.textContent = data.answer;
    if (data.sources && data.sources.length) {
      const src = document.createElement('div');
      src.className = 'src';
      src.textContent = '依据：' + data.sources
        .map(s => `${formatTime(s.start)}-${formatTime(s.end)}`)
        .join('、');
      item.appendChild(src);
    }
  } catch (e) {
    item.textContent = '提问失败：' + e.message;
  }
}

// ---------- MD5 ----------
// crypto.subtle 不支持 MD5，这里内嵌一份标准实现。
// 分片去重与合并都依赖同一个全局摘要，算法必须与后端一致。
function md5OfFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        onProgress && onProgress(100);
        resolve(md5(new Uint8Array(e.target.result)));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('读取文件失败'));
    reader.readAsArrayBuffer(file);
  });
}

function md5(bytes) {
  function add32(a, b) { return (a + b) & 0xFFFFFFFF; }
  function cmn(q, a, b, x, s, t) {
    a = add32(add32(a, q), add32(x, t));
    return add32((a << s) | (a >>> (32 - s)), b);
  }
  function ff(a, b, c, d, x, s, t) { return cmn((b & c) | (~b & d), a, b, x, s, t); }
  function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
  function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
  function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }

  const len = bytes.length;
  const words = [];
  for (let i = 0; i < len * 8; i += 8) {
    words[i >> 5] = (words[i >> 5] || 0) | (bytes[i / 8] << (i % 32));
  }
  words[len * 8 >> 5] = (words[len * 8 >> 5] || 0) | (0x80 << (len * 8 % 32));

  const totalWords = (((len + 8) >> 6) + 1) * 16;
  words[totalWords - 2] = len * 8;

  let a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;

  for (let i = 0; i < totalWords; i += 16) {
    const [oA, oB, oC, oD] = [a, b, c, d];

    a = ff(a, b, c, d, words[i] | 0, 7, -680876936);
    d = ff(d, a, b, c, words[i + 1] | 0, 12, -389564586);
    c = ff(c, d, a, b, words[i + 2] | 0, 17, 606105819);
    b = ff(b, c, d, a, words[i + 3] | 0, 22, -1044525330);
    a = ff(a, b, c, d, words[i + 4] | 0, 7, -176418897);
    d = ff(d, a, b, c, words[i + 5] | 0, 12, 1200080426);
    c = ff(c, d, a, b, words[i + 6] | 0, 17, -1473231341);
    b = ff(b, c, d, a, words[i + 7] | 0, 22, -45705983);
    a = ff(a, b, c, d, words[i + 8] | 0, 7, 1770035416);
    d = ff(d, a, b, c, words[i + 9] | 0, 12, -1958414417);
    c = ff(c, d, a, b, words[i + 10] | 0, 17, -42063);
    b = ff(b, c, d, a, words[i + 11] | 0, 22, -1990404162);
    a = ff(a, b, c, d, words[i + 12] | 0, 7, 1804603682);
    d = ff(d, a, b, c, words[i + 13] | 0, 12, -40341101);
    c = ff(c, d, a, b, words[i + 14] | 0, 17, -1502002290);
    b = ff(b, c, d, a, words[i + 15] | 0, 22, 1236535329);

    a = gg(a, b, c, d, words[i + 1] | 0, 5, -165796510);
    d = gg(d, a, b, c, words[i + 6] | 0, 9, -1069501632);
    c = gg(c, d, a, b, words[i + 11] | 0, 14, 643717713);
    b = gg(b, c, d, a, words[i] | 0, 20, -373897302);
    a = gg(a, b, c, d, words[i + 5] | 0, 5, -701558691);
    d = gg(d, a, b, c, words[i + 10] | 0, 9, 38016083);
    c = gg(c, d, a, b, words[i + 15] | 0, 14, -660478335);
    b = gg(b, c, d, a, words[i + 4] | 0, 20, -405537848);
    a = gg(a, b, c, d, words[i + 9] | 0, 5, 568446438);
    d = gg(d, a, b, c, words[i + 14] | 0, 9, -1019803690);
    c = gg(c, d, a, b, words[i + 3] | 0, 14, -187363961);
    b = gg(b, c, d, a, words[i + 8] | 0, 20, 1163531501);
    a = gg(a, b, c, d, words[i + 13] | 0, 5, -1444681467);
    d = gg(d, a, b, c, words[i + 2] | 0, 9, -51403784);
    c = gg(c, d, a, b, words[i + 7] | 0, 14, 1735328473);
    b = gg(b, c, d, a, words[i + 12] | 0, 20, -1926607734);

    a = hh(a, b, c, d, words[i + 5] | 0, 4, -378558);
    d = hh(d, a, b, c, words[i + 8] | 0, 11, -2022574463);
    c = hh(c, d, a, b, words[i + 11] | 0, 16, 1839030562);
    b = hh(b, c, d, a, words[i + 14] | 0, 23, -35309556);
    a = hh(a, b, c, d, words[i + 1] | 0, 4, -1530992060);
    d = hh(d, a, b, c, words[i + 4] | 0, 11, 1272893353);
    c = hh(c, d, a, b, words[i + 7] | 0, 16, -155497632);
    b = hh(b, c, d, a, words[i + 10] | 0, 23, -1094730640);
    a = hh(a, b, c, d, words[i + 13] | 0, 4, 681279174);
    d = hh(d, a, b, c, words[i] | 0, 11, -358537222);
    c = hh(c, d, a, b, words[i + 3] | 0, 16, -722521979);
    b = hh(b, c, d, a, words[i + 6] | 0, 23, 76029189);
    a = hh(a, b, c, d, words[i + 9] | 0, 4, -640364487);
    d = hh(d, a, b, c, words[i + 12] | 0, 11, -421815835);
    c = hh(c, d, a, b, words[i + 15] | 0, 16, 530742520);
    b = hh(b, c, d, a, words[i + 2] | 0, 23, -995338651);

    a = ii(a, b, c, d, words[i] | 0, 6, -198630844);
    d = ii(d, a, b, c, words[i + 7] | 0, 10, 1126891415);
    c = ii(c, d, a, b, words[i + 14] | 0, 15, -1416354905);
    b = ii(b, c, d, a, words[i + 5] | 0, 21, -57434055);
    a = ii(a, b, c, d, words[i + 12] | 0, 6, 1700485571);
    d = ii(d, a, b, c, words[i + 3] | 0, 10, -1894986606);
    c = ii(c, d, a, b, words[i + 10] | 0, 15, -1051523);
    b = ii(b, c, d, a, words[i + 1] | 0, 21, -2054922799);
    a = ii(a, b, c, d, words[i + 8] | 0, 6, 1873313359);
    d = ii(d, a, b, c, words[i + 15] | 0, 10, -30611744);
    c = ii(c, d, a, b, words[i + 6] | 0, 15, -1560198380);
    b = ii(b, c, d, a, words[i + 13] | 0, 21, 1309151649);
    a = ii(a, b, c, d, words[i + 4] | 0, 6, -145523070);
    d = ii(d, a, b, c, words[i + 11] | 0, 10, -1120210379);
    c = ii(c, d, a, b, words[i + 2] | 0, 15, 718787259);
    b = ii(b, c, d, a, words[i + 9] | 0, 21, -343485551);

    a = add32(a, oA);
    b = add32(b, oB);
    c = add32(c, oC);
    d = add32(d, oD);
  }

  const hex = n => {
    let s = '';
    for (let i = 0; i < 4; i++) {
      s += ((n >> (i * 8 + 4)) & 0x0F).toString(16) + ((n >> (i * 8)) & 0x0F).toString(16);
    }
    return s;
  };

  return (hex(a) + hex(b) + hex(c) + hex(d)).toLowerCase();
}
</script>
</body>
</html>
